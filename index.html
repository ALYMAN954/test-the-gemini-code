<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>سجل متابعة دورات التجويد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<script src="config.js?v=20261115"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#f3f5fb; --surface:#ffffff; --surface2:#eceffa; --ink:#1b1a3d; --muted:#5a5e86; --line:#d9dcee;
  --primary:#2f2d66; --on-primary:#ffffff; --accent:#4cc3e0; --accent-ink:#0d5a70;
  --ok:#1b7a4b; --ok-bg:#dff3e8; --warn:#8a5a00; --warn-bg:#fdf0cf; --bad:#b3261e; --bad-bg:#fbe2df;
  --band:#2f2d66; --band-ink:#ffffff;
  --font-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111128; --surface:#1a1a3b; --surface2:#232349; --ink:#eceefb; --muted:#a4a8d2; --line:#2f3162;
  --primary:#4cc3e0; --on-primary:#0b1030; --accent:#4cc3e0; --accent-ink:#7fdaf0;
  --ok:#6fd49b; --ok-bg:#16382a; --warn:#f0c768; --warn-bg:#3a2f12; --bad:#ff8f86; --bad-bg:#43191a;
  --band:#1a1a3b; --band-ink:#eceefb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111128; --surface:#1a1a3b; --surface2:#232349; --ink:#eceefb; --muted:#a4a8d2; --line:#2f3162;
  --primary:#4cc3e0; --on-primary:#0b1030; --accent:#4cc3e0; --accent-ink:#7fdaf0;
  --ok:#6fd49b; --ok-bg:#16382a; --warn:#f0c768; --warn-bg:#3a2f12; --bad:#ff8f86; --bad-bg:#43191a;
  --band:#1a1a3b; --band-ink:#eceefb; color-scheme:dark}
:root[data-palette="emerald"]{--bg:#f1f7f4;--surface2:#e6f1ec;--line:#d3e4dc;--muted:#4f6f62;--primary:#1f6b52;--accent:#34b58a;--accent-ink:#0f5a40;--band:#1f6b52}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-palette="emerald"]{--bg:#0e1a16;--surface:#15251f;--surface2:#1c3129;--line:#29443a;--muted:#9fc2b4;--primary:#46c79b;--on-primary:#06231a;--accent:#46c79b;--accent-ink:#7fe0bd;--band:#15251f}}
:root[data-theme="dark"][data-palette="emerald"]{--bg:#0e1a16;--surface:#15251f;--surface2:#1c3129;--line:#29443a;--muted:#9fc2b4;--primary:#46c79b;--on-primary:#06231a;--accent:#46c79b;--accent-ink:#7fe0bd;--band:#15251f}
:root[data-palette="plum"]{--bg:#f8f3fa;--surface2:#f0e6f4;--line:#e3d3ea;--muted:#70567b;--primary:#5b2a6e;--accent:#b565d0;--accent-ink:#6f2f8a;--band:#5b2a6e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-palette="plum"]{--bg:#1a1020;--surface:#251530;--surface2:#301c3d;--line:#432a52;--muted:#c3a6d0;--primary:#d49be8;--on-primary:#2a0f35;--accent:#d49be8;--accent-ink:#e6bff5;--band:#251530}}
:root[data-theme="dark"][data-palette="plum"]{--bg:#1a1020;--surface:#251530;--surface2:#301c3d;--line:#432a52;--muted:#c3a6d0;--primary:#d49be8;--on-primary:#2a0f35;--accent:#d49be8;--accent-ink:#e6bff5;--band:#251530}
:root[data-palette="sand"]{--bg:#faf6ec;--surface2:#f2ead4;--line:#e6dcc0;--muted:#7a6a45;--primary:#7a5a12;--accent:#d9a62e;--accent-ink:#6b4d0a;--band:#6b4d0a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-palette="sand"]{--bg:#1b160a;--surface:#251e0f;--surface2:#31281a;--line:#463b24;--muted:#cbb78a;--primary:#e7bf5a;--on-primary:#2b1f03;--accent:#e7bf5a;--accent-ink:#f0d58a;--band:#251e0f}}
:root[data-theme="dark"][data-palette="sand"]{--bg:#1b160a;--surface:#251e0f;--surface2:#31281a;--line:#463b24;--muted:#cbb78a;--primary:#e7bf5a;--on-primary:#2b1f03;--accent:#e7bf5a;--accent-ink:#f0d58a;--band:#251e0f}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
.wrap{max-width:1000px;margin:0 auto}
header.top{background:var(--band);color:var(--band-ink);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.hrow{display:flex;align-items:center;gap:12px}
.logo{background:#fff;border-radius:12px;padding:4px;width:clamp(78px,22vw,104px);height:clamp(78px,22vw,104px);flex:none;display:grid;place-items:center}
.logo.l2{width:clamp(62px,17vw,84px);height:clamp(62px,17vw,84px);padding:3px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:1.35rem;line-height:1.3}
.ttl p{margin:2px 0 0;opacity:.85;font-size:.9rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2)}
.tools .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.88rem}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
header.top .btn{background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.35);padding:5px 12px;min-height:34px;font-size:.9rem}
header.top .btn:hover{border-color:#fff}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent);vertical-align:middle;margin-inline-end:6px;border:1px solid rgba(255,255,255,.7)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding-top:22px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
main>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-size:1.15rem;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.fld{display:grid;gap:5px;min-width:0}
.fld>label,.lbl{font-size:.85rem;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=password],input[type=email],input[type=tel],input[type=number],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:42px}
textarea{min-height:76px;resize:vertical}
input:disabled{opacity:.45}
.chk{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--primary)}
.day{background:var(--surface2);border-radius:8px;padding:9px 11px;min-height:42px;display:flex;flex-direction:column;justify-content:center;line-height:1.3}
.day small{color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.choice{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:26px 22px;cursor:pointer;display:grid;gap:6px;min-height:120px;align-content:center}
.choice:hover{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.choice b{font-family:var(--font-display);font-size:1.5rem;color:var(--primary)}
.choice span{color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.9rem}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.login{max-width:420px;margin:30px auto 0;width:100%}
.err{color:var(--bad);font-size:.9rem;min-height:1.4em;margin:6px 0 0}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.9rem}
.crumbs button{background:none;border:0;color:var(--accent-ink);cursor:pointer;padding:2px 4px;text-decoration:underline}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.tab.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.sumline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip.present,.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.absent,.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.excused,.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.none{background:var(--surface2);color:var(--muted)}
.students{display:grid;gap:10px}
.stu{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px;border-inline-start:6px solid var(--line)}
.stu.present{border-inline-start-color:var(--ok)}
.stu.absent{border-inline-start-color:var(--bad)}
.stu.excused{border-inline-start-color:var(--warn)}
.stu-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stu-name{flex:1;min-width:140px;text-align:start;background:none;border:0;cursor:pointer;font-weight:600;font-size:1.02rem;padding:4px 0}
.sc{font-variant-numeric:tabular-nums;font-family:var(--font-display);font-size:1.05rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{padding:10px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.opt.present{color:var(--ok)} .opt.present.on{background:var(--ok-bg);border-color:var(--ok)}
.opt.absent{color:var(--bad)} .opt.absent.on{background:var(--bad-bg);border-color:var(--bad)}
.opt.excused{color:var(--warn)} .opt.excused.on{background:var(--warn-bg);border-color:var(--warn)}
.grades{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.9rem;min-height:36px}
.pill.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pill.na{opacity:.5;cursor:default;border-style:dashed}
.info{color:var(--muted);font-size:.85rem}
.missed{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem}
.linkbox{display:flex;gap:8px;flex-wrap:wrap}
.linkbox input{flex:1;min-width:180px;direction:ltr;text-align:left}
.saved{position:fixed;inset-block-end:calc(14px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));
  background:var(--primary);color:var(--on-primary);padding:6px 14px;border-radius:99px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.saved.show{opacity:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
th{background:var(--surface2);font-size:.85rem;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{padding:10px 14px;border-radius:8px}
.alerts .a{background:var(--bad-bg);color:var(--bad)}
.alerts .p{background:var(--warn-bg);color:var(--warn)}
.alerts .none{background:var(--ok-bg);color:var(--ok)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.inl{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.inl .fld{flex:1;min-width:150px}
select.mini{min-height:32px;padding:3px 8px;font-size:.85rem;width:auto;max-width:170px}
#report{position:fixed;left:-99999px;top:0;width:1100px;background:#fff;color:#1b1a3d;direction:rtl;font-family:var(--font-body);padding:24px}
#report h2{font-size:22px;margin:0 0 4px;color:#2f2d66}
#report h3{font-size:16px;margin:18px 0 6px;color:#2f2d66}
#report table{min-width:0;font-size:13px}
#report th{background:#eceffa;color:#444}
#report td,#report th{border:1px solid #d9dcee;padding:6px 8px}
#report p{margin:2px 0;font-size:13px}
@media (max-width:520px){.ttl h1{font-size:1.02rem}.ttl p{font-size:.78rem}.logo{width:76px;height:76px}.logo.l2{width:56px;height:56px}.hrow{gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  body{background:#fff!important;color:#000!important;padding:0!important}
  header.top,.tools,.toolbar,.crumbs,.tabs,#saved,.btn,select.mini,.linkbox{display:none!important}
  .card{border:1px solid #ccc!important;box-shadow:none!important;break-inside:avoid;margin-bottom:12px}
  .tw{overflow:visible!important;border:0!important}
  table{min-width:0!important;font-size:12px}
  th,td{border:1px solid #ccc!important;padding:5px 7px!important}
}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar"></div>
<div id="saved" class="saved" role="status" aria-live="polite">تم الحفظ</div>
<div id="report" aria-hidden="true"></div>

<script>
document.documentElement.dir='rtl';
document.documentElement.lang='ar';
const LOGO='assets/logo-sharqiya.png';
const LOGO2='assets/logo-markaz.jpg';
const DEF_CIRCLES=[
 {id:'q1',cat:'quran',freq:'weekly',name:'الدورة التأهيلية (أ)'},
 {id:'q2',cat:'quran',freq:'weekly',name:'الدورة التأهيلية (ب)'},
 {id:'q3',cat:'quran',freq:'weekly',name:'الدورة المتقدمة (أ)'},
 {id:'q4',cat:'quran',freq:'weekly',name:'الدورة المتقدمة (ب)'},
 {id:'q5',cat:'quran',freq:'weekly',name:'الدورة المكثفة (أ)'},
 {id:'q6',cat:'quran',freq:'weekly',name:'الدورة المكثفة (ب)'},
 {id:'a1',cat:'arabic',freq:'weekly',name:'دورة السلسبيل (أ)'},
 {id:'a2',cat:'arabic',freq:'weekly',name:'دورة السلسبيل (ب)'}
];
const CATS={quran:'حلقات قرآنية',arabic:'حلقات اللغة العربية'};
const FREQ={weekly:'أسبوعية',daily:'يومية'};
const ATT={present:'حضور',absent:'غياب',excused:'استئذان'};
const MEDIA=['سبورة','لوحات','باوربوينت'];
const SHEETS=['ورقية','إلكترونية'];
const DEGREES=['بكالوريوس','دبلوم','طالب','عامل'];
const PALETTES=[['navy','كحلي'],['emerald','أخضر'],['plum','بنفسجي'],['sand','ذهبي']];
const UKEY='tajweed-ui';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid=p=>p+Math.random().toString(36).slice(2,9);
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayName=s=>parseISO(s).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{weekday:'long'});
const hijri=s=>parseISO(s).toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'});
const hijriYear=()=>{try{const p=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{year:'numeric'}).formatToParts(new Date());return p.find(x=>x.type==='year').value.replace(/\D/g,'')}catch(e){return ''}};
const daysSince=ds=>Math.floor((Date.now()-parseISO(ds).getTime())/864e5);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const sig=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const fmtTs=t=>{const d=new Date(t);return iso(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

/* ---------- appearance (per viewer) ---------- */
let ui0={theme:null,palette:'navy'};
try{ui0=Object.assign(ui0,JSON.parse(localStorage.getItem(UKEY)||'{}'))}catch(e){}
function applyUi(){const r=document.documentElement;
  if(ui0.theme) r.setAttribute('data-theme',ui0.theme); else r.removeAttribute('data-theme');
  r.setAttribute('data-palette',ui0.palette||'navy');
  try{localStorage.setItem(UKEY,JSON.stringify(ui0))}catch(e){}}
const isDark=()=>ui0.theme?ui0.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
applyUi();

/* ---------- data store: Supabase (shared) ---------- */
const S={cfg:{},teachers:{},sups:{},students:{},records:{},audit:{}};
let SB=null,SB2=null,ready=false,slow=false,writeBlocked=false,studentTok=null,pollT=null,rtOn=false;
let PUB={names:[],needsSetup:false,header:null};
const APPCFG=window.APP_CONFIG||{};
const APP_OK=!!(APPCFG.SUPABASE_URL&&APPCFG.SUPABASE_ANON_KEY&&!/YOUR_/.test(APPCFG.SUPABASE_URL+APPCFG.SUPABASE_ANON_KEY)&&window.supabase);
const MAIL='@tajweed-app.com';
const timers={},chains={};
const CFG=()=>S.cfg.main||{header:{fasl:'',year:''},settings:{absLimit:3,pctLimit:60,passAtt:75},circles:[]};
function flashSaved(msg){const el=$('#saved');if(!el)return;el.textContent=msg||'تم الحفظ';el.classList.add('show');clearTimeout(flashSaved.t);flashSaved.t=setTimeout(()=>el.classList.remove('show'),msg?2800:1200)}
const circleOf=(coll,d)=>coll==='students'?d.circleId:(coll==='records'||coll==='audit')?d.cid:null;
function touch(coll,id,delay){const key=coll+'/'+id;clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(coll,id),delay==null?350:delay)}
function flush(coll,id){
  const key=coll+'/'+id;clearTimeout(timers[key]);delete timers[key];
  const data=S[coll][id];
  chains[key]=(chains[key]||Promise.resolve()).then(async()=>{
    try{
      const r=data?await SB.from('docs').upsert({coll,id,circle_id:circleOf(coll,data),data:clone(data),updated_at:new Date().toISOString()})
                  :await SB.from('docs').delete().eq('coll',coll).eq('id',id);
      if(r.error) throw r.error;
      flashSaved();
    }catch(e){
      if(e&&(e.code==='42501'||/row-level|permission/i.test(e.message||''))){writeBlocked=true;flashSaved('لا تملك صلاحية لهذا الإجراء')}
      else flashSaved('تعذر الحفظ، تحقق من الاتصال');
      render();
    }
  });
  return chains[key];
}
function put(coll,id,data){S[coll][id]=data;touch(coll,id)}
function remove(coll,id){delete S[coll][id];touch(coll,id,0)}

async function fetchAll(coll){
  let out=[],from=0;
  for(;;){
    const {data,error}=await SB.from('docs').select('id,data').eq('coll',coll).range(from,from+999);
    if(error) throw error; out=out.concat(data); if(data.length<1000) break; from+=1000;
  }
  return out;
}
function mergeColl(coll,m){
  let ch=false;
  for(const id of Object.keys(S[coll])) if(!(id in m)&&!timers[coll+'/'+id]){delete S[coll][id];ch=true}
  for(const id of Object.keys(m)){if(timers[coll+'/'+id]) continue; if(sig(m[id])!==sig(S[coll][id])){S[coll][id]=m[id];ch=true}}
  return ch;
}
async function loadAll(){

  for(const c of ['cfg','students','records']){const m={};(await fetchAll(c)).forEach(r=>m[r.id]=r.data);ch=mergeColl(c,m)||ch}
  if(auth.s){
    const {data}=await SB.from('docs').select('id,data').eq('coll','audit').order('updated_at',{ascending:false}).limit(300);
    const m={};(data||[]).forEach(r=>m[r.id]=r.data);ch=mergeColl('audit',m)||ch;
  }
  const {data:ps,error}=await SB.from('profiles').select('*'); if(error) throw error;
  const T={},U={};
  (ps||[]).forEach(p=>{const o={id:p.id,name:p.name,circleId:p.circle_id,mustChange:p.must_change,key:p.login_key};(p.role==='supervisor'?U:T)[p.id]=o});
  if(sig(T)!==sig(S.teachers)||sig(U)!==sig(S.sups)){S.teachers=T;S.sups=U;ch=true}
  return ch;
}
function subscribe(){
  if(rtOn) return; rtOn=true;
  try{SB.channel('rt-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    const r=p.eventType==='DELETE'?p.old:p.new; if(!r||!S[r.coll]) return;
    const key=r.coll+'/'+r.id; if(timers[key]) return;
    if(p.eventType==='DELETE'){if(S[r.coll][r.id]){delete S[r.coll][r.id];softRender()}}
    else if(sig(r.data)!==sig(S[r.coll][r.id])){S[r.coll][r.id]=r.data;softRender()}
  }).subscribe()}catch(e){}
  clearInterval(pollT);
  pollT=setInterval(()=>{if(auth.t||auth.s) loadAll().then(ch=>ch&&softRender()).catch(()=>{})},30000);
}

const recKey=(cid,d)=>cid+'_'+d;
function newMeta(){return {lesson:'',hifz:'',tilawa:'',matn:'',media:'',mediaOther:'',sheets:'',sheetsOther:'',noHif:false,noMtn:false,noHw:false,notes:''}}
function getRec(cid,date,create){
  const k=recKey(cid,date);
  if(!S.records[k]&&create) S.records[k]={cid,date,meta:newMeta(),rows:{}};
  return S.records[k]||{cid,date,meta:newMeta(),rows:{}};
}
const touchRec=r=>touch('records',recKey(r.cid,r.date));
function sessionsOf(cid){return Object.values(S.records).filter(r=>r.cid===cid&&Object.values(r.rows||{}).some(x=>x.att)).sort((a,b)=>a.date<b.date?1:-1)}
function maxRec(m){return 5+(m.noHif?2:0)+(m.noMtn?2:0)+(m.noHw?1:0)}
function score(row,m){
  const rec=row.rec?maxRec(m):0, hif=m.noHif?0:(row.hif?2:0), mtn=m.noMtn?0:(row.mtn?2:0), hw=m.noHw?0:(row.hw?1:0);
  return {rec,hif,mtn,hw,total:rec+hif+mtn+hw};
}
function statOf(s,ses){
  const o={s,present:0,absent:0,excused:0,sum:0};
  ses.forEach(r=>{const row=(r.rows||{})[s.id];if(!row||!row.att)return;o[row.att]++;if(row.att==='present')o.sum+=score(row,r.meta).total});
  const n=o.present+o.absent+o.excused;
  o.pct=o.present?Math.round(o.sum/(o.present*10)*100):null;
  o.attPct=n?Math.round(o.present/n*100):null;
  return o;
}
const statsOf=cid=>{const ses=sessionsOf(cid);return studentsOf(cid).map(s=>statOf(s,ses))};
function alertsOf(cid){
  const st=settings(),out=[];
  statsOf(cid).forEach(o=>{
    if(o.absent>=st.absLimit) out.push({t:'a',m:`الطالب ${o.s.name} غاب ${o.absent} مرات، وهذا يبلغ حد التنبيه (${st.absLimit}) أو يتجاوزه.`});
    if(o.pct!=null&&o.pct<st.pctLimit) out.push({t:'p',m:`مجموع درجات الطالب ${o.s.name} ${o.pct}%، وهو أقل من ${st.pctLimit}%.`});
  });
  return out;
}
function lateInfo(c){
  const th=c.freq==='daily'?1:7, s=sessionsOf(c.id)[0], d=s?daysSince(s.date):null;
  return {late:d===null||d>th,days:d,last:s?s.date:null,th};
}
function missedFor(s,cid,date){
  const out=[];
  for(const r of sessionsOf(cid)){
    if(r.date>=date) continue; const row=r.rows[s.id]; if(!row||!row.att) continue;
    if(row.att==='present') break; out.push(r); if(out.length>=3) break;
  }
  return out;
}

/* ---------- export ---------- */
function dlSave(filename,data){
  const type=/\.pdf$/.test(filename)?'application/pdf':/\.xlsx$/.test(filename)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/json';
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  flashSaved('تم التصدير');
}

function exportXlsx(cid){
  const c=circ(cid), st=statsOf(cid), ses=sessionsOf(cid).slice().reverse();
  const a=[['الطالب','حضور','غياب','استئذان','نسبة الحضور %','متوسط الدرجات %','رقم الإثبات','الإيميل','الجوال','جهة العمل','الدرجة العلمية']];
  st.forEach(o=>a.push([o.s.name,o.present,o.absent,o.excused,o.attPct==null?'':o.attPct,o.pct==null?'':o.pct,o.s.idno,o.s.email,o.s.phone,o.s.work,o.s.degree]));
  const b=[['التاريخ','اليوم','الدرس النظري','الحفظ المطلوب','التلاوة المطلوبة','المتن المطلوب','الوسائل','أوراق العمل','الطالب','الحالة','التلاوة','الحفظ','المتن','الواجب','المجموع من 10','ملاحظات']];
  ses.forEach(r=>{const m=r.meta;studentsOf(cid,true).forEach(s=>{const row=r.rows[s.id]; if(!row||!row.att) return;
    const sc=row.att==='present'?score(row,m):null;
    b.push([r.date,dayName(r.date),m.lesson,m.hifz,m.tilawa,m.matn,m.media==='أخرى'?m.mediaOther:m.media,m.sheets==='أخرى'?m.sheetsOther:m.sheets,s.name,ATT[row.att],sc?sc.rec:'',sc?sc.hif:'',sc?sc.mtn:'',sc?sc.hw:'',sc?sc.total:'',row.note||'']);});});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'الطلاب');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(b),'الجلسات');
  wb.Workbook={Views:[{RTL:true}]};
  dlSave('سجل-'+c.name+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}));
}
async function pdfFrom(html,filename,landscape){
  const rep=$('#report'); rep.style.width=landscape?'1100px':'760px'; rep.innerHTML=html;
  try{
    flashSaved('جاري تجهيز الملف');
    const canvas=await html2canvas(rep,{scale:2,backgroundColor:'#ffffff'});
    const pdf=new window.jspdf.jsPDF({orientation:landscape?'landscape':'portrait',unit:'mm',format:'a4'});
    const W=landscape?297:210,H=landscape?210:297,M=8,iw=W-2*M,ih=canvas.height*iw/canvas.width,usable=H-2*M,pages=Math.max(1,Math.ceil(ih/usable));
    const img=canvas.toDataURL('image/jpeg',0.92);
    for(let i=0;i<pages;i++){
      if(i>0) pdf.addPage();
      pdf.addImage(img,'JPEG',M,M-i*usable,iw,ih);
      pdf.setFillColor(255,255,255);pdf.rect(0,0,W,M,'F');pdf.rect(0,H-M,W,M,'F');
    }
    dlSave(filename,pdf.output('arraybuffer'));
  }catch(e){window.print()}
  rep.innerHTML='';
}
const repHead=()=>`<h2>سجل متابعة دورات التجويد · جامع مبارك بن عسكر الهاجري</h2>`;
function studentPdf(sid){
  const s=S.students[sid]; if(!s) return;
  const c=circ(s.circleId), o=statOf(s,sessionsOf(s.circleId)), h=header(), st=settings();
  pdfFrom(`${repHead()}<h3>تقرير الطالب</h3><p><b>${esc(s.name)}</b> · ${c?esc(c.name):''} · الفصل: ${esc(h.fasl)} · العام: ${esc(h.year)} هـ</p>
   <p>${[s.degree,s.work].filter(Boolean).map(esc).join(' · ')}</p>
   <p>الحضور: ${o.present} · الغياب: ${o.absent} · الاستئذان: ${o.excused} · نسبة الحضور: ${o.attPct==null?'—':o.attPct+'%'} · متوسط الدرجات: ${o.pct==null?'—':o.pct+'%'}</p>
   <p><b>${o.attPct!=null&&o.attPct>=st.passAtt?'يستحق الشهادة (نسبة الحضور المطلوبة '+st.passAtt+'%)':'لم يبلغ نسبة الحضور المطلوبة ('+st.passAtt+'%)'}</b></p>
   <h3>سجل الجلسات</h3>${studentTable(s).replace('class="tw"','')}`,'تقرير-'+s.name+'.pdf',false);

function backup(){
  dlSave('نسخة-احتياطية-'+iso(new Date())+'.json',JSON.stringify({app:'tajweed',version:3,exportedAt:new Date().toISOString(),cfg:S.cfg,students:S.students,records:S.records,audit:S.audit}));
}
async function doRestore(d){
  const rows=[];
  const now=new Date().toISOString();
  for(const coll of ['cfg','students','records','audit']){
    const src=d[coll]||{};
    for(const id of Object.keys(src)){
      S[coll][id]=src[id];
      rows.push({coll,id,circle_id:circleOf(coll,src[id]),data:clone(src[id]),updated_at:now});
    }
  }
  try{
    flashSaved('جاري استعادة البيانات...');
    for(let i=0;i<rows.length;i+=100){
      const {error}=await SB.from('docs').upsert(rows.slice(i,i+100));
      if(error) throw error;
    }
    ui.confirmRestore=null;render();flashSaved('تمت الاستعادة بنجاح');
  }catch(e){
    flashSaved('حدث خطأ أثناء الاستعادة');
  }
}

/* ---------- events ---------- */
const needT=()=>S.teachers[auth.t];
function ensureRec(){const t=needT();return getRec(t.circleId,view.date,true)}
function setAtt(r,sid,v){
  const prev=(r.rows[sid]||{}).att||'';
  r.rows[sid]=Object.assign({rec:false,hif:false,mtn:false,hw:false,note:''},r.rows[sid],{att:v});
  if(prev!==v){const s=S.students[sid];logAudit({cid:r.cid,date:r.date,student:s?s.name:'',from:prev,to:v})}
}
function resetUi(){
  auth={t:null,s:null,sname:''};view={screen:'home',date:iso(new Date())};
  ui={open:null,addStudent:false,err:'',linkFor:null,resetId:null,confirmRestore:null};
  sup={tab:'circles',cat:null,freq:null,cid:null,linkFor:null};
  S.cfg={};S.teachers={};S.sups={};S.students={};S.records={};S.audit={};
}
async function signOutAll(){try{await SB.auth.signOut()}catch(e){}resetUi();await refreshPublic()}
function routeAfterLogin(p){
  view.date=iso(new Date());ui.err='';
  if(p.role==='supervisor') view.screen='sHome';
  else{const t=S.teachers[p.id];view.screen=t&&t.mustChange?'tChange':(t&&t.circleId?'tHome':'tPick')}
}
async function enterSession(){
  const {data:{session}}=await SB.auth.getSession(); if(!session) return null;
  const {data:p}=await SB.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!p){await SB.auth.signOut();return null}
  auth={t:p.role==='teacher'?p.id:null,s:p.role==='supervisor'?p.id:null,sname:p.name};
  await loadAll(); subscribe(); return p;
}
const refreshAdmin=async()=>{await loadAll();render()};

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, t=needT();
  if(act==='home'){ui.err='';view.screen='home';render()}
  else if(act==='enter'){ui.err='';const to=b.dataset.to;
    if(to==='t'&&auth.t) view.screen='tHome';
    else if(to==='s'&&auth.s) view.screen='sHome';
    else{if(auth.t||auth.s) await signOutAll(); view.screen=to==='t'?'tLogin':'sLogin'}
    render()}
  else if(act==='logout'){await signOutAll();render()}
  else if(act==='theme'){ui0.theme=isDark()?'light':'dark';applyUi();render()}
  else if(act==='palette'){const i=PALETTES.findIndex(p=>p[0]===ui0.palette);ui0.palette=PALETTES[(i+1)%PALETTES.length][0];applyUi();render()}
  else if(act==='back'){ui.err='';view.screen=auth.t?'tHome':'sHome';render()}
  else if(act==='chpw'){ui.err='';view.screen='tChange';render()}
  else if(act==='schpw'){ui.err='';view.screen='sChange';render()}
  else if(act==='pick'){const {error}=await SB.rpc('set_my_circle',{cid:b.dataset.cid});
    if(error){flashSaved('تعذر تحديد الحلقة');return}
    t.circleId=b.dataset.cid;view.screen='tHome';view.date=iso(new Date());render()}
  else if(act==='open'){ui.open=ui.open===b.dataset.sid?null:b.dataset.sid;ui.linkFor=null;renderStudents()}
  else if(act==='att'){const r=ensureRec();setAtt(r,b.dataset.sid,b.dataset.v);ui.open=null;touchRec(r);renderStudents()}
  else if(act==='tog'){const r=ensureRec(),row=r.rows[b.dataset.sid],k=b.dataset.k;row[k]=!row[k];touchRec(r);renderStudents()}
  else if(act==='allpresent'){const r=ensureRec();let n=0;studentsOf(t.circleId).forEach(s=>{if(!(r.rows[s.id]||{}).att){r.rows[s.id]=Object.assign({rec:false,hif:false,mtn:false,hw:false,note:''},r.rows[s.id],{att:'present'});n++}});
    if(n){logAudit({cid:r.cid,date:r.date,student:'(حضور الكل: '+n+' طالب)',from:'',to:'present'});touchRec(r)}renderStudents()}
  else if(act==='bulk'){const r=ensureRec(),k=b.dataset.k,m=r.meta;if((k==='hif'&&m.noHif)||(k==='mtn'&&m.noMtn)||(k==='hw'&&m.noHw)){flashSaved('هذا البند غير مطلوب في هذه الجلسة');return}
    const ps=studentsOf(t.circleId).filter(s=>(r.rows[s.id]||{}).att==='present');if(!ps.length){flashSaved('سجّل حضور الطلاب أولاً');return}
    const allOn=ps.every(s=>r.rows[s.id][k]);ps.forEach(s=>r.rows[s.id][k]=!allOn);
    logAudit({cid:r.cid,date:r.date,student:`(تحديث جماعي: ${k})`,from:'',to:!allOn?'مفعل':'ملغى'});
    touchRec(r);renderStudents()}
  else if(act==='copyprev'){const prev=sessionsOf(t.circleId).find(x=>x.date<view.date);
    if(!prev){flashSaved('لا توجد جلسة سابقة للنسخ منها');return}
    const r=ensureRec(),pm=prev.meta;['hifz','tilawa','matn','lesson','media','mediaOther','sheets','sheetsOther','noHif','noMtn','noHw'].forEach(k=>r.meta[k]=pm[k]);
    logAudit({cid:r.cid,date:r.date,student:'(نسخ المقررات)',from:'',to:prev.date});
    touchRec(r);render();flashSaved('نُسخت المقررات من جلسة '+prev.date)}
  else if(act==='link'){ui.linkFor=ui.linkFor===b.dataset.sid?null:b.dataset.sid;renderStudents()}
  else if(act==='regenlink'){const s=S.students[b.dataset.sid];if(s){s.token=newToken();put('students',s.id,s);if(auth.t)renderStudents();else render();flashSaved('تم إنشاء رابط جديد وإلغاء القديم')}}
  else if(act==='copylink'){const inp=$('#lk-'+b.dataset.sid);if(inp){inp.focus();inp.select();try{navigator.clipboard.writeText(inp.value).then(()=>flashSaved('نُسخ الرابط'),()=>flashSaved('حدّد الرابط وانسخه يدوياً'))}catch(x){flashSaved('حدّد الرابط وانسخه يدوياً')}}}
  else if(act==='stop'){const s=S.students[b.dataset.sid];s.active=false;put('students',s.id,s);ui.open=null;renderStudents()}
  else if(act==='react'){const s=S.students[b.dataset.sid];s.active=true;put('students',s.id,s);render()}
  else if(act==='addtoggle'){ui.addStudent=!ui.addStudent;render()}
  else if(act==='stab'){sup.tab=b.dataset.v;render()}
  else if(act==='s'){const l=+b.dataset.lvl;if(l<=0)sup.cat=null;if(l<=1)sup.freq=null;sup.cid=null;render()}
  else if(act==='scat'){sup.cat=b.dataset.v;render()}
  else if(act==='sfreq'){sup.freq=b.dataset.v;render()}
  else if(act==='scirc'){sup.cid=b.dataset.v;sup.linkFor=null;render()}
  else if(act==='slink'){sup.linkFor=sup.linkFor===b.dataset.sid?null:b.dataset.sid;render()}
  else if(act==='spdf') studentPdf(b.dataset.sid);
  else if(act==='print') window.print();
  else if(act==='tclear'){const {error}=await SB.from('profiles').update({circle_id:null}).eq('id',b.dataset.id);if(error)flashSaved('تعذر التنفيذ');await refreshAdmin()}
  else if(act==='tdel'){const {error}=await SB.rpc('admin_delete_user',{uid:b.dataset.id});if(error)flashSaved('تعذر الحذف');await refreshAdmin()}
  else if(act==='treset'){ui.resetId=ui.resetId===b.dataset.id?null:b.dataset.id;render()}
  else if(act==='supdel'){const {error}=await SB.rpc('admin_delete_user',{uid:b.dataset.id});if(error)flashSaved('تعذر الحذف');await refreshAdmin()}
  else if(act==='cdel'){const c=CFG();c.circles=c.circles.filter(x=>x.id!==sup.cid);put('cfg','main',c);sup.cid=null;render()}
  else if(act==='xlsx') exportXlsx(sup.cid);
  else if(act==='bak') backup();
  else if(act==='restoreok'){doRestore(ui.confirmRestore.data)}
  else if(act==='restorecancel'){ui.confirmRestore=null;render()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.m){const r=ensureRec();r.meta[el.dataset.m]=el.value;touchRec(r)}
  else if(el.dataset.h){const c=CFG();c.header=Object.assign({},c.header,{[el.dataset.h]:el.value});touch('cfg','main');const t=$('#term');if(t)t.innerHTML=termText()}
  else if(el.dataset.note){const r=ensureRec(),sid=el.dataset.note;r.rows[sid]=Object.assign({att:'',rec:false,hif:false,mtn:false,hw:false},r.rows[sid],{note:el.value});touchRec(r)}
  else if(el.dataset.cname){const c=CFG(),x=c.circles.find(y=>y.id===el.dataset.cname);if(x&&el.value.trim()){x.name=el.value;touch('cfg','main')}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='date'&&el.value){view.date=el.value;ui.open=null;render()}
  else if(el.dataset.c){const r=ensureRec();r.meta[el.dataset.c]=el.checked;touchRec(r);render()}
  else if(el.dataset.sel==='media'||el.dataset.sel==='sheets'){
    const f=el.dataset.sel,r=ensureRec();r.meta[f]=el.value;touchRec(r);
    const o=$('#'+f+'Other');o.hidden=el.value!=='أخرى';if(!o.hidden)o.focus()}
  else if(el.dataset.sel==='deg'){const o=$('#n-degOther');o.hidden=el.value!=='غير ذلك';if(!o.hidden)o.focus()}
  else if(el.dataset.lim){const v=Math.max(1,parseInt(el.value)||1),c=CFG();c.settings=Object.assign({},settings(),{[el.dataset.lim]:v});put('cfg','main',c);render()}
  else if(el.dataset.mv&&el.value){const s=S.students[el.dataset.mv];s.circleId=el.value;put('students',s.id,s);render();flashSaved('نُقل الطالب')}
  else if(el.id==='rf'&&el.files[0]){

  }
});
const pwOk=p=>p&&p.length>=6;
const PWMSG='كلمة السر قصيرة. اكتب 6 أحرف على الأقل.';
async function createAccount(name,pw,role){
  const key=newKey();
  const r=await SB2.auth.signUp({email:key+MAIL,password:pw});
  if(r.error||!r.data||!r.data.user) return {error:(r.error&&r.error.message)||'تعذر إنشاء الحساب'};
  const ins=await SB.from('profiles').insert({id:r.data.user.id,login_key:key,role,name,must_change:role==='teacher'});
  return ins.error?{error:ins.error.message}:{ok:true};
}
document.addEventListener('submit',async e=>{
  const f=e.target.dataset.form; if(!f) return; e.preventDefault();
  const err=m=>{ui.err=m;const x=$('#err');if(x)x.textContent=m};
  const btn=e.target.querySelector('button[type=submit]');if(btn)btn.disabled=true;
  try{
  if(f==='setup'){
    const n=$('#su-name').value.trim(),p=$('#su-pw').value,p2=$('#su-pw2').value;
    if(!pwOk(p)) return err(PWMSG);
    if(p!==p2) return err('كلمتا السر غير متطابقتين.');
    const key=newKey(),email=key+MAIL;
    const su=await SB.auth.signUp({email,password:p});
    if(su.error) return err('تعذر إنشاء الحساب: '+su.error.message);
    if(!su.data.session){const si=await SB.auth.signInWithPassword({email,password:p});if(si.error) return err('عطّل خيار تأكيد البريد في إعدادات Supabase (انظر README) ثم أعد المحاولة.')}
    const cl=await SB.rpc('claim_first_supervisor',{p_name:n,p_key:key});
    if(cl.error){await SB.auth.signOut();await refreshPublic();return err('تم إعداد النظام مسبقاً.')}
    const cf=await SB.from('docs').upsert({coll:'cfg',id:'main',circle_id:null,data:{header:{fasl:'',year:hijriYear()},settings:{absLimit:3,pctLimit:60,passAtt:75},circles:clone(DEF_CIRCLES)}});
    if(cf.error) return err('تعذر حفظ الإعدادات: '+cf.error.message);
    const p0=await enterSession();ui.err='';if(p0){routeAfterLogin(p0)}render();
  } else if(f==='tlogin'||f==='slogin'){
    const key=$('#who').value,pw=$('#pw').value;
    if(!pw) return err('اكتب كلمة السر.');
    const si=await SB.auth.signInWithPassword({email:key+MAIL,password:pw});
    if(si.error) return err('كلمة السر غير صحيحة.');
    const p0=await enterSession();
    if(!p0||(f==='tlogin')!==(p0.role==='teacher')){await signOutAll();view.screen=f==='tlogin'?'tLogin':'sLogin';return err('هذا الحساب لا يتبع هذه الصفحة.')}
    routeAfterLogin(p0);render();
  } else if(f==='change-t'||f==='change-s'){
    const p=$('#np1').value,p2=$('#np2').value;
    if(!pwOk(p)) return err(PWMSG);
    if(p!==p2) return err('كلمتا السر غير متطابقتين.');
    const up=await SB.auth.updateUser({password:p});
    if(up.error) return err('تعذر تغيير كلمة السر: '+up.error.message);
    if(f==='change-t'){await SB.rpc('clear_must_change');const t=S.teachers[auth.t];t.mustChange=false;view.screen=t.circleId?'tHome':'tPick'}
    else view.screen='sHome';
    ui.err='';render();flashSaved('تم تغيير كلمة السر');
  } else if(f==='addstu'){
    const name=$('#n-name').value.trim(); if(!name) return;
    let deg=$('#n-deg').value; if(deg==='غير ذلك') deg=$('#n-degOther').value.trim()||'غير ذلك';
    const id=uid('s');put('students',id,{id,circleId:needT().circleId,name,idno:$('#n-id').value.trim(),email:$('#n-mail').value.trim(),phone:$('#n-phone').value.trim(),work:$('#n-work').value.trim(),degree:deg,active:true,token:newToken()});
    ui.addStudent=false;render();
  } else if(f==='addteacher'||f==='addsup'){
    const isT=f==='addteacher',name=$(isT?'#tn-name':'#sn-name').value.trim(),p=$(isT?'#tn-pass':'#sn-pass').value.trim();
    if(!pwOk(p)){flashSaved(PWMSG);return err(PWMSG)}
    const r=await createAccount(name,p,isT?'teacher':'supervisor');
    if(r.error) return err('تعذر الإضافة: '+r.error);
    ui.err='';await refreshAdmin();flashSaved('تمت الإضافة');
  } else if(f==='tresetdo'){
    const id=e.target.dataset.id,p=$('#rp').value.trim();
    if(!pwOk(p)){flashSaved(PWMSG);return}
    const r=await SB.rpc('admin_set_password',{uid:id,pw:p});
    if(r.error){flashSaved('تعذر إعادة التعيين');return}
    ui.resetId=null;await refreshAdmin();flashSaved('أُعيد تعيين كلمة السر');
  } else if(f==='cadd'){
    const name=$('#c-name').value.trim();if(!name) return;
    const c=CFG();c.circles=c.circles.concat([{id:uid('c'),cat:sup.cat,freq:sup.freq,name}]);put('cfg','main',c);render();
  }
  }finally{if(btn)btn.disabled=false}
});

/* ---------- start ---------- */
async function boot(){
  const h=location.hash; if(h.startsWith('#me-')) studentTok=h.slice(4);
  if(!APP_OK){ready=true;render();return}
  SB=window.supabase.createClient(APPCFG.SUPABASE_URL,APPCFG.SUPABASE_ANON_KEY);
  SB2=window.supabase.createClient(APPCFG.SUPABASE_URL,APPCFG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'tajweed-tmp'}});
  render();
  setTimeout(()=>{if(!ready){slow=true;render()}},10000);
  try{
    if(studentTok){
      const {data}=await SB.rpc('student_view',{tok:studentTok});
      if(data){S.cfg.main=data.cfg;S.students[data.student.id]=data.student;(data.records||[]).forEach(r=>S.records[r.id]=r.data)}
      ready=true;render();return;
    }
    await refreshPublic();
    const p=await enterSession();
    if(p) routeAfterLogin(p);
  }catch(e){slow=true}
  ready=true;render();
}
boot();
